name: Build and publish Muhn Pace Cloudstream extension

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-muhn-pace
  cancel-in-progress: true

jobs:
  build:
    # A manual dispatch from a development branch must never publish.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this extension
        uses: actions/checkout@v6

      - name: Check out the official Cloudstream Gradle wrapper
        uses: actions/checkout@v6
        with:
          repository: recloudstream/extensions
          ref: cf16b3b45cda911a36ddca69f9acbe4763c6a4b1
          path: upstream
          sparse-checkout: |
            gradle/wrapper
            gradlew
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare the Gradle wrapper and check Android API 35
        run: |
          cp upstream/gradlew .
          mkdir -p gradle
          cp -R upstream/gradle/wrapper gradle/
          chmod +x gradlew
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"

      - name: Run the project checks
        run: python3 -m unittest discover -s tests -v

      - name: Build the Android Cloudstream extension
        run: ./gradlew :MuhnPace:make --no-daemon --stacktrace

      - name: Assemble and validate the repository
        run: |
          python3 scripts/publish.py --build-dir MuhnPace/build --repo "$GITHUB_REPOSITORY" --out published
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json
          out = Path('published')
          repo = json.loads((out / 'repo.json').read_text())
          [entry] = json.loads((out / 'plugins.json').read_text())
          package = out / 'MuhnPace.cs3'
          assert repo['pluginLists'][0].endswith('/builds/plugins.json')
          assert entry['url'].endswith('/builds/' + package.name)
          assert entry['fileHash'] == 'sha256-' + hashlib.sha256(package.read_bytes()).hexdigest()
          assert entry['fileSize'] == package.stat().st_size
          with ZipFile(package) as z:
              assert z.testzip() is None
              manifest = json.loads(z.read('manifest.json'))
              assert manifest['name'] == entry['internalName']
              assert manifest['version'] == entry['version']
              assert manifest['pluginClassName'] == 'com.muhnpacedirect.MuhnPacePlugin'
              dex = z.read('classes.dex')
              assert dex.startswith(b'dex\n')
              assert b'Lcom/muhnpacedirect/MuhnPacePlugin;' in dex
              assert b'Lcom/muhnpacedirect/MuhnPaceProvider;' in dex
          PY

      - name: Upload the compiled extension and indexes
        uses: actions/upload-artifact@v7
        with:
          name: MuhnPaceCloudstream
          path: published/
          if-no-files-found: error

      - name: Publish the Cloudstream repository
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code origin refs/heads/builds > /dev/null; then
            git fetch origin refs/heads/builds:refs/remotes/origin/builds
            git worktree add -b builds publish-branch refs/remotes/origin/builds
          else
            git worktree add --detach publish-branch HEAD
            git -C publish-branch switch --orphan builds
          fi
          cp published/{MuhnPace.cs3,plugins.json,repo.json} publish-branch/
          git -C publish-branch add MuhnPace.cs3 plugins.json repo.json
          if ! git -C publish-branch diff --cached --quiet; then
            git -C publish-branch -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Build Muhn Pace from $GITHUB_SHA"
            git -C publish-branch push origin HEAD:refs/heads/builds
          fi

      - name: Check live Pixeldrain access from the runner
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re
          from urllib.request import Request, urlopen
          from pathlib import Path
          base = 'https://pixeldrain.dev/api'
          provider = next(Path('MuhnPace/src').rglob('MuhnPaceProvider.kt')).read_text()
          for name, list_id in re.findall(r'Arc\("([^"]+)", "([^"]+)"\)', provider):
              with urlopen(f'{base}/list/{list_id}', timeout=15) as response:
                  collection = json.load(response)
              assert collection['success'] and collection['files'], name
              videos = [f for f in collection['files'] if f['mime_type'].startswith('video/')]
              print(f'{name}: {len(videos)} source videos', flush=True)
              if name == 'Dressrosa':
                  req = Request(f"{base}/file/{videos[0]['id']}", headers={'Range': 'bytes=0-63'})
                  with urlopen(req, timeout=15) as media:
                      assert media.status == 206 and media.read(64)[4:8] == b'ftyp'
                  print('Dressrosa: anonymous MP4 byte-range request passed', flush=True)
          PY
