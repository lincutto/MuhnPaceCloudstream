name: Build and publish Muhn Pace Cloudstream extension

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this extension
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Check out official Cloudstream extension build tools
        uses: actions/checkout@v4
        with:
          repository: recloudstream/extensions
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy custom provider into the official build project
        run: cp -R custom/MuhnPace upstream/MuhnPace

      - name: Build real Cloudstream .cs3 package
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :MuhnPace:make --no-daemon --stacktrace

      - name: Package repository metadata
        run: |
          python3 custom/scripts/publish.py \
            --build-dir upstream/MuhnPace/build \
            --repo "$GITHUB_REPOSITORY" \
            --out published

      - name: Upload compiled plugin as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuhnPaceCloudstream
          path: published/*.cs3
          if-no-files-found: error

      - name: Publish Cloudstream repository to builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd published
          git init
          git checkout -b builds
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Build extension from $GITHUB_SHA"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
